# paddock tool definition for OpenAI's Codex CLI with a local model served by
# the shared paddock-llm container (KEY=VALUE, not sourced).
# Program `paddock attach` runs in /workspace.
command=codex
# Arguments `paddock attach --yolo` adds (empty: --yolo is refused).
yolo_args=--dangerously-bypass-approvals-and-sandbox
# npm package `paddock build codex-local` resolves the latest version from.
npm_package=@openai/codex
# Uses the shared model server, which joins the internal networks of this
# tool's instances and of no other instance.
service=llm
# Codex settings, rendered per instance on every start (@LLM_*@ placeholders
# from the llm_* settings) and mounted read-only at config_path, where Codex
# reads its system config. ~/.codex/config.toml in the instance overrides
# single keys.
config_template=config.toml
config_path=/etc/codex/config.toml
