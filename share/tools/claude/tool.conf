# paddock tool definition for Claude Code (KEY=VALUE, not sourced).
# Program `paddock attach` runs in /workspace.
command=claude
# Arguments `paddock attach --yolo` adds (empty: --yolo is refused).
yolo_args=--dangerously-skip-permissions
# npm package `paddock build claude` resolves the latest version from.
npm_package=@anthropic-ai/claude-code
# Mounted read-only in the agent: Claude Code on the host runs hooks from
# .claude/settings*.json and MCP server commands from .mcp.json.
protect_paths=.claude/ .mcp.json
